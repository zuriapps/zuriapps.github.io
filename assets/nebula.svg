<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <filter id="cloud" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .009" numOctaves="4" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="170" xChannelSelector="R" yChannelSelector="B"/>
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <radialGradient id="blue"><stop stop-color="#245dff" stop-opacity=".8"/><stop offset=".45" stop-color="#3235dc" stop-opacity=".45"/><stop offset="1" stop-color="#182580" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple"><stop stop-color="#b33ff0" stop-opacity=".65"/><stop offset=".45" stop-color="#7030d6" stop-opacity=".4"/><stop offset="1" stop-color="#421985" stop-opacity="0"/></radialGradient>
  </defs>
  <g filter="url(#cloud)" transform="rotate(-28 800 600)">
    <ellipse cx="330" cy="260" rx="680" ry="200" fill="url(#blue)"/>
    <ellipse cx="510" cy="310" rx="510" ry="125" fill="url(#purple)"/>
    <ellipse cx="1110" cy="800" rx="680" ry="210" fill="url(#blue)"/>
    <ellipse cx="1250" cy="860" rx="580" ry="125" fill="url(#purple)"/>
  </g>
</svg>
